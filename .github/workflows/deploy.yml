name: Deploy to GitHub Pages
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Work out the site address
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          O=$(echo "$OWNER" | tr 'A-Z' 'a-z'); N=$(echo "$NAME" | tr 'A-Z' 'a-z')
          if [ -n "$CUSTOM_DOMAIN" ]; then B=/; S="https://$CUSTOM_DOMAIN"
          elif [ "$N" = "$O.github.io" ]; then B=/; S="https://$N"
          else B="/$N/"; S="https://$O.github.io/$N"; fi
          echo "VITE_BASE=$B" >> "$GITHUB_ENV"; echo "VITE_SITE_URL=$S" >> "$GITHUB_ENV"; echo "Site: $S (base $B)"
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
